<html>
<head>
  <style>
    .aethryx-button {
      display: inline-block;
      color: blue;
      background-color: black;
      text-decoration: none;
      border-radius: 100px;
      padding: 100px 200px;
      transition: 0.3s ease;
      font-size: 100px;
    }
    @keyframes wiggle{
      0%{transform: scale(1.1)rotate(0deg);}
      25%{transform: scale(1.1)rotate(-5deg);}
      50%{transform: scale(1.1)rotate(5deg);}
      755{transform: scale(1.1)rotate(0deg);}
    }
    .aethryx-button:hover {
      background-color: orange;
      color: teal;
      animation: wiggle 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <a href="https://aethryx-ai-workspace.genmb.com/" class="aethryx-button">CLICK ME!</a>
</body>
</html>
